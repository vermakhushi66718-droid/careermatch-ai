# Render Blueprint: New + > Blueprint > connect the GitHub repo containing this project.
# Creates a managed PostgreSQL database and one Docker web service that serves the API and the React app.
databases:
  - name: careermatch-db
    databaseName: careermatch
    user: careermatch
    plan: free

services:
  - type: web
    name: careermatch-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: careermatch-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@careermatch.local
      - key: ADMIN_PASSWORD
        generateValue: true          
      - key: SEED_ON_START
        value: "true"                
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash               
